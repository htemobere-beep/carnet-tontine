<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carnet Tontine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Plan : carnet mobile en une colonne. La cagnotte du tour est le grand chiffre (mono), un anneau montre les cotisations payées, chaque membre a une bascule Payé / À payer et un rappel WhatsApp. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --fg:#13201A; --muted:#566860; --line:#DAE2DB;
  --accent:#E3A400; --accent-ink:#1E1500; --accent-soft:#FBEFC7; --track:rgba(19,32,26,.13);
  --ok:#1D7A4B; --on-ok:#FFFFFF; --ok-soft:#DDF1E5; --late:#B23F28; --late-soft:#F8E1DB;
  --scrim:rgba(10,18,14,.55); --shadow:0 1px 0 rgba(19,32,26,.04),0 8px 22px -14px rgba(19,32,26,.35);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1612; --surface:#16231D; --fg:#E7EFE9; --muted:#95A89D; --line:#26362D;
    --accent:#F0B52A; --accent-ink:#1B1400; --accent-soft:#2B2511; --track:rgba(231,239,233,.16);
    --ok:#4CC38A; --on-ok:#07140D; --ok-soft:#173326; --late:#F08A70; --late-soft:#3A1F18;
    --scrim:rgba(0,0,0,.65); --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 22px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1612; --surface:#16231D; --fg:#E7EFE9; --muted:#95A89D; --line:#26362D;
  --accent:#F0B52A; --accent-ink:#1B1400; --accent-soft:#2B2511; --track:rgba(231,239,233,.16);
  --ok:#4CC38A; --on-ok:#07140D; --ok-soft:#173326; --late:#F08A70; --late-soft:#3A1F18;
  --scrim:rgba(0,0,0,.65); --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 22px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--f-body);-webkit-text-size-adjust:100%;
  padding-block:12px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:28px;font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:650}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:22px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{font:700 19px var(--f-display);letter-spacing:-.01em;display:inline-flex;align-items:center;gap:10px}
.logo{flex:none;display:block}
.eyebrow{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-size:30px}
.note{font-size:13px;color:var(--muted);line-height:1.45}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:700 16px var(--f-body);text-decoration:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.danger{background:transparent;border:1.5px solid var(--late);color:var(--late)}
.btn.block{width:100%}
.icon{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none}
.icon.sm{width:36px;height:36px;font-size:16px}
.icon:disabled{opacity:.35;cursor:default}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:inherit;text-align:left}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font:600 12px/1.6 var(--f-body);background:var(--accent-soft);color:var(--fg);white-space:nowrap}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:12px}
.tcard{width:100%;text-align:left;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tc-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tc-sub{color:var(--muted);font-size:15px}
.pbar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--ok);border-radius:99px}
.tc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px}

.empty{padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.empty ol{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:15px}
.stack{display:flex;flex-direction:column;gap:10px}

.hero{background:var(--accent-soft);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero-main{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero-main>div{min-width:0}
.who{font:700 26px var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.pot{font-size:34px;font-weight:500;line-height:1.1}
.pot small{font-size:15px;color:var(--muted)}
.ring{width:112px;height:112px;flex:none}
.rt{fill:none;stroke:var(--track);stroke-width:12}
.rf{fill:none;stroke:var(--ok);stroke-width:12;stroke-linecap:round}
.rn{font:500 22px var(--f-mono);fill:var(--fg)}
.rs{font:500 11px var(--f-body);fill:var(--muted)}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font:700 16px var(--f-display);flex:none}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rn2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rn2 b{overflow-wrap:anywhere}
.sm-link{font-size:14px;color:var(--muted);width:max-content}
.pay{flex:none;min-width:104px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.pay[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.actions{display:flex;flex-direction:column;gap:10px}

.order{display:flex;flex-direction:column}
.orow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}
.num{width:28px;flex:none;font:500 15px var(--f-mono);color:var(--muted)}
.ob{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.ob .linkbtn{overflow-wrap:anywhere}
.ob small{color:var(--muted);font-size:13px}
.orow.past .ob{opacity:.65}

form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-weight:600;font-size:14px}
.field small{color:var(--muted);font-size:13px}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;min-height:50px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
textarea{min-height:140px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.two{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:10px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--ok);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:999px;background:var(--accent-soft);font-size:14px}
.chip i{font-style:normal;color:var(--muted)}
.err{color:var(--late);font-weight:600;min-height:1.4em}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.dock .btn{display:flex;max-width:560px;margin-inline:auto}
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--surface);color:var(--fg);border-radius:20px 20px 0 0;padding-top:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet textarea{min-height:120px}
.sheet .btns{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);text-align:center}
.lock{padding:16px;display:flex;flex-direction:column;gap:12px}
.lock .btn{width:100%}
.lock .stack,.lock .field{display:flex;flex-direction:column;gap:6px}
.devcode{font:500 34px var(--f-mono);letter-spacing:.06em;text-align:center;padding:10px 0;background:var(--accent-soft);border-radius:12px}
.lock textarea{font:400 13px/1.4 var(--f-mono);word-break:break-all}
.warn{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.warn a{font-weight:700;color:inherit}
.brand{font:700 19px var(--f-display);letter-spacing:-.01em;display:inline-flex;align-items:center;gap:10px}
.logo{flex:none;display:block}
@media (prefers-reduced-motion:no-preference){
  .pay,.btn,.pbar span{transition:background-color .15s,width .25s}
}
</style>

</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var KEY='carnet-tontine-v1';
var COUNTRIES=[
  {dial:'242',name:'Congo (Brazzaville)',keep:true},{dial:'243',name:'RD Congo'},{dial:'237',name:'Cameroun'},
  {dial:'225',name:"Côte d'Ivoire",keep:true},{dial:'221',name:'Sénégal'},{dial:'229',name:'Bénin',keep:true},
  {dial:'228',name:'Togo'},{dial:'223',name:'Mali'},{dial:'226',name:'Burkina Faso'},{dial:'',name:'Autre pays (écrire +indicatif)'}
];
var FREQ={day:{adj:'Quotidienne',unit:'jour'},week:{adj:'Hebdomadaire',unit:'semaine'},month:{adj:'Mensuelle',unit:'mois'}};
var SLIDERS='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>';

var state={tontines:[],settings:{dial:'242'}};
var view={name:'home'}, sheet=null, sync='local', touched=false;
var ref=null, writing=false, timer=null;

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function fmt(n){return new Intl.NumberFormat('fr-FR').format(n||0).replace(/ /g,' ')}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayISO(){return iso(new Date())}
function startOfToday(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function fmtDate(d){return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}
function initial(n){return (String(n||'?').trim().charAt(0)||'?').toUpperCase()}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}

/* ---------- accès par code ---------- */
var PUB='BPD51WuInUo9nGqOfC42wh2sK1n66WczK8p891uL5GuLg3fhDCyKTiKdlc0DuXtyqvQ-J99IlqdLi0UNnJHU92I';
var OWNER_WA='242066019702';
var ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var access=null, memDev='', lockMsg='';
function makeId(){var a=new Uint8Array(8);crypto.getRandomValues(a);var s='';for(var i=0;i<8;i++){s+=ALPHA.charAt(a[i]%32);if(i===3)s+='-'}return s}
function device(){
  try{var d=localStorage.getItem('ct-device');if(d&&/^[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(d))return d;d=makeId();localStorage.setItem('ct-device',d);return d}
  catch(e){return memDev||(memDev=makeId())}
}
function ymdNow(){var d=new Date();return ''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())}
function fmtY(s){return s.slice(6,8)+'/'+s.slice(4,6)+'/'+s.slice(0,4)}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function checkCode(text){
  var m=/(\d{8})\.([A-Za-z0-9_-]{86})/.exec(String(text||'').replace(/\s+/g,''));
  if(!m)return Promise.resolve({ok:false,why:'format'});
  var exp=m[1],dev=device();
  return crypto.subtle.importKey('raw',unb64u(PUB),{name:'ECDSA',namedCurve:'P-256'},false,['verify']).then(function(k){
    return crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,unb64u(m[2]),new TextEncoder().encode('CT1|'+dev+'|'+exp));
  }).then(function(ok){
    if(!ok)return {ok:false,why:'bad'};
    if(exp<ymdNow())return {ok:false,why:'expired',exp:exp};
    return {ok:true,exp:exp,code:m[1]+'.'+m[2]};
  },function(){return {ok:false,why:'error'}});
}
function gate(){
  var saved='';try{saved=localStorage.getItem('ct-unlock')||''}catch(e){}
  if(!saved)return Promise.resolve(false);
  return checkCode(saved).then(function(r){
    if(r.ok){access=r;return true}
    lockMsg=r.why==='expired'?'Ton accès a expiré le '+fmtY(r.exp)+'. Demande un nouveau code.':'';
    return false;
  });
}
function waLink(text){return 'https://wa.me/'+OWNER_WA+'?text='+encodeURIComponent(text)}
function renewLink(){return waLink('Bonjour, je veux renouveler Carnet Tontine. Mon code d\'appareil : '+device())}
function daysLeft(){if(!access)return 99;var e=access.exp,d=new Date(+e.slice(0,4),+e.slice(4,6)-1,+e.slice(6,8));return Math.round((d-startOfToday())/864e5)}
function accessLine(){return access?'Accès valable jusqu\'au '+fmtY(access.exp)+'.':''}
function renderLock(msg){
  var dev=device(),ask='Bonjour, je veux activer Carnet Tontine. Mon code d\'appareil : '+dev;
  $('sheet').innerHTML='';
  $('app').innerHTML='<div class="wrap"><header class="stack"><span class="brand">'+LOGO(48)+'Carnet Tontine</span><h1>Active ton carnet</h1><p class="muted">Cette application est réservée aux abonnés. Chaque appareil a son propre code d\'accès.</p></header>'
  +'<section class="card lock"><div class="eyebrow">Code de ton appareil</div><div class="devcode" id="devcode">'+esc(dev)+'</div>'
  +'<a class="btn" target="_blank" rel="noopener" href="'+waLink(ask)+'">Demander mon code sur WhatsApp</a>'
  +'<button class="btn ghost" data-act="lock-copy">Copier le code de mon appareil</button></section>'
  +'<section class="card lock"><div class="field"><label for="l-code">J\'ai reçu mon code de déblocage</label><textarea id="l-code" autocomplete="off" placeholder="Colle ici le code reçu"></textarea></div>'
  +'<div class="err" id="l-err" role="alert">'+esc(msg||'')+'</div><button class="btn" data-act="lock-go">Activer</button></section></div>';
}
function lockGo(){
  var err=$('l-err');err.textContent='Vérification…';
  checkCode($('l-code').value).then(function(r){
    if(r.ok){try{localStorage.setItem('ct-unlock',r.code)}catch(e){}access=r;start();return}
    err.textContent=r.why==='expired'?'Ce code a expiré le '+fmtY(r.exp)+'. Demande un nouveau code.'
      :r.why==='format'?'Ce n\'est pas un code complet. Copie-le en entier depuis le message reçu.'
      :r.why==='error'?'Impossible de vérifier le code sur ce navigateur. Ouvre le lien dans Chrome ou Safari à jour.'
      :'Ce code ne marche pas sur cet appareil. Il faut le code reçu après avoir envoyé le code de cet appareil.';
  });
}

/* ---------- données ---------- */
function normalize(s){
  try{s=JSON.parse(JSON.stringify(s||{}))}catch(e){s={}}
  var out={tontines:Array.isArray(s.tontines)?s.tontines:[],settings:Object.assign({dial:'242'},s.settings||{})};
  out.tontines.forEach(function(t){t.members=t.members||[];t.order=t.order||t.members.map(function(m){return m.id});t.paid=t.paid||{};t.history=t.history||[];t.round=t.round||0;t.cycles=t.cycles||1});
  return out;
}
function T(id){return state.tontines.find(function(t){return t.id===id})}
function M(t,id){return t.members.find(function(m){return m.id===id})}
function pot(t){return t.amount*t.members.length}
function paidIds(t,r){return t.members.filter(function(m){return t.paid[r]&&t.paid[r][m.id]})}
function paidN(t){return paidIds(t,t.round).length}
function done(t){return t.round>=t.order.length}
function benef(t){return done(t)?null:M(t,t.order[t.round])}
function dueDate(t,r){
  var p=t.start.split('-').map(Number),dt=new Date(p[0],p[1]-1,p[2]);
  if(t.freq==='day')dt.setDate(p[2]+r);
  else if(t.freq==='week')dt.setDate(p[2]+7*r);
  else{dt.setMonth(p[1]-1+r);if(dt.getDate()!==p[2])dt.setDate(0)}
  return dt;
}
function isLate(t){return !done(t)&&paidN(t)<t.members.length&&dueDate(t,t.round)<startOfToday()}

/* ---------- enregistrement ---------- */
function save(){
  touched=true;
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  flush();
}
function flush(){
  if(!ref)return;
  clearTimeout(timer);
  timer=setTimeout(function(){
    if(writing){flush();return}
    writing=true;
    ref.set({state:JSON.parse(JSON.stringify(state)),updatedAt:Date.now()}).then(function(){setSync('cloud')},function(){setSync('local')}).then(function(){writing=false});
  },700);
}
function syncText(){
  return sync==='cloud'
    ?'Tes tontines sont enregistrées sur ton compte et restent privées.'
    :'Tes tontines sont gardées sur cet appareil seulement. Si tu vides les données du navigateur, elles disparaissent.';
}
function setSync(v){sync=v;var el=$('syncnote');if(el)el.textContent=syncText()}
function start(){
  try{var raw=localStorage.getItem(KEY);if(raw)state=normalize(JSON.parse(raw))}catch(e){}
  render();
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return;
      return user.id().then(function(id){
        if(!id)return;
        var d=db.doc('data/users/'+id+'/carnet');
        return d.get().then(function(snap){
          ref=d;
          if(snap.exists&&snap.data()&&snap.data().state){
            var remote=normalize(snap.data().state);
            if(touched){var ids={};remote.tontines.forEach(function(t){ids[t.id]=1});state.tontines.forEach(function(t){if(!ids[t.id])remote.tontines.push(t)})}
            state=remote;
            try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
            setSync('cloud');render();if(touched)save();
          }else{
            setSync('cloud');
            if(state.tontines.length)save();
          }
        });
      });
    }).catch(function(){});
  }catch(e){}
}

/* ---------- contacts et messages ---------- */
function waNumber(p){
  var s=String(p||'').replace(/[^\d+]/g,'');if(!s)return '';
  if(s.charAt(0)==='+')return s.slice(1);
  if(s.slice(0,2)==='00')return s.slice(2);
  var c=COUNTRIES.find(function(c){return c.dial===state.settings.dial});
  if(!c||!c.dial)return s;
  if(s.charAt(0)==='0'&&!c.keep)s=s.slice(1);
  return c.dial+s;
}
function reminderText(t,m){
  return 'Bonjour '+m.name+', petit rappel pour la tontine « '+t.name+' » : ta cotisation de '+fmt(t.amount)+' FCFA pour le tour '+(t.round+1)+' ('+fmtDate(dueDate(t,t.round))+'). Merci !';
}
function summaryText(t){
  var r=t.round,b=benef(t),ok=paidIds(t,r),ko=t.members.filter(function(m){return !(t.paid[r]&&t.paid[r][m.id])});
  var l=['Tontine « '+t.name+' » : tour '+(r+1)+'/'+t.order.length+' ('+fmtDate(dueDate(t,r))+')','Bénéficiaire : '+b.name];
  if(ok.length)l.push('✅ Payé : '+ok.map(function(m){return m.name}).join(', '));
  if(ko.length)l.push('⏳ Reste à payer : '+ko.map(function(m){return m.name}).join(', ')+' ('+fmt(ko.length*t.amount)+' FCFA)');
  l.push('Cagnotte : '+fmt(ok.length*t.amount)+' / '+fmt(pot(t))+' FCFA');
  return l.join('\n');
}
function toast(msg){
  var el=$('toast');el.textContent=msg;el.hidden=false;
  clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},2200);
}
function copy(text){
  var p=null;
  try{p=navigator.clipboard&&navigator.clipboard.writeText(text)}catch(e){}
  if(p&&p.then){p.then(function(){toast('Copié')},function(){sheet={type:'text',text:text};renderSheet()})}
  else{sheet={type:'text',text:text};renderSheet()}
}
function parseMembers(txt){
  return String(txt||'').split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){
    var m=l.match(/^(.*?)[\s,;:-]*((?:\+|00)?\d[\d\s.\-()]{5,})$/),name=l,phone='';
    if(m&&m[1].trim()){name=m[1].trim();phone=m[2].replace(/[^\d+]/g,'')}
    return {id:uid(),name:name,phone:phone};
  });
}

function ring(p,total){
  var R=48,C=2*Math.PI*R,f=total?p/total:0;
  return '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+p+' cotisations payées sur '+total+'"><circle cx="60" cy="60" r="'+R+'" class="rt"/><circle cx="60" cy="60" r="'+R+'" class="rf" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-f)).toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="60" text-anchor="middle" class="rn">'+p+'/'+total+'</text><text x="60" y="80" text-anchor="middle" class="rs">payées</text></svg>';
}

/* ---------- fenêtres ---------- */

  var el=$('sheet');
  if(!sheet){el.innerHTML='';return}
  var h='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">';
  if(sheet.type==='confirm'){
    h+='<h2>'+esc(sheet.title)+'</h2><p class="muted">'+esc(sheet.body)+'</p><div class="btns"><button class="btn'+(sheet.danger?' danger':'')+' block" data-act="'+sheet.act+'" data-t="'+(sheet.t||'')+'">'+esc(sheet.yes)+'</button><button class="btn ghost block" data-act="close-sheet">Annuler</button></div>';
  }else if(sheet.type==='text'){
    h+='<h2>Copie ce texte</h2><textarea id="s-text" readonly>'+esc(sheet.text)+'</textarea><div class="btns"><button class="btn block" data-act="close-sheet">Fermer</button></div>';
  }else if(sheet.type==='settings'){
    h+='<h2>Réglages</h2><div class="field"><label for="set-dial">Pays des numéros de téléphone</label><select id="set-dial">'
      +COUNTRIES.map(function(c){return '<option value="'+c.dial+'"'+(c.dial===state.settings.dial?' selected':'')+'>'+esc(c.name+(c.dial?' (+'+c.dial+')':''))+'</option>'}).join('')
      +'</select><small>Un numéro écrit avec + et l\'indicatif marche toujours, quel que soit le pays.</small></div><p class="note">'+esc(syncText())+'</p><p class="note">'+esc(accessLine())+' Code de cet appareil : '+esc(device())+'</p><div class="btns"><button class="btn block" data-act="close-sheet">Terminé</button></div>';
  }else if(sheet.type==='member'){
    var t=T(sheet.t),m=sheet.m?M(t,sheet.m):null;
    h+='<h2>'+(m?'Modifier le membre':'Nouveau membre')+'</h2><form id="memberform" data-t="'+t.id+'" data-m="'+(m?m.id:'')+'" novalidate>'
      +'<div class="field"><label for="m-name">Nom</label><input id="m-name" type="text" autocomplete="off" value="'+esc(m?m.name:'')+'"></div>'
      +'<div class="field"><label for="m-phone">Téléphone (facultatif)</label><input id="m-phone" type="tel" autocomplete="off" value="'+esc(m?m.phone:'')+'"></div>'
      +'<div id="m-err" class="err" role="alert"></div><div class="btns"><button class="btn block" type="submit">Enregistrer</button>'
      +(m&&t.history.length===0&&t.members.length>2?'<button class="btn danger block" type="button" data-act="remove-member" data-t="'+t.id+'" data-m="'+m.id+'">Retirer de la tontine</button>':'')
      +'<button class="btn ghost block" type="button" data-act="close-sheet">Annuler</button></div></form>';
  }
  h+='</div></div>';
  el.innerHTML=h;
  var f=$('m-name')||$('s-text');
  if(f)setTimeout(function(){f.focus();if(f.id==='s-text')f.select()},30);
}

function render(){
  $('app').innerHTML=view.name==='new'?newV():view.name==='detail'?detailV():homeV();
  renderSheet();
}
function go(v){view=v;sheet=null;render();window.scrollTo(0,0)}

/* ---------- actions ---------- */
function exampleT(){
  var names=['Marie','Josiane','Prisca','Hervé','Clarisse','Bienvenu'];
  var ms=names.map(function(n){return {id:uid(),name:n,phone:''}});
  var order=[ms[2],ms[0],ms[4],ms[1],ms[5],ms[3]].map(function(m){return m.id});
  var d=new Date();d.setDate(d.getDate()-14);
  var t={id:uid(),name:'Tontine du marché',amount:5000,freq:'week',start:iso(d),members:ms,order:order,round:2,paid:{},history:[],cycles:1,example:true};
  t.history=[{r:0,mid:order[0],got:30000,date:iso(dueDate(t,0))},{r:1,mid:order[1],got:30000,date:iso(dueDate(t,1))}];
  t.paid[2]={};t.paid[2][ms[0].id]=true;t.paid[2][ms[1].id]=true;t.paid[2][ms[3].id]=true;
  return t;
}
function createTontine(){
  var name=$('f-name').value.trim(),amount=parseInt(($('f-amount').value||'').replace(/\D/g,''),10);
  var members=parseMembers($('f-members').value);
  var err=!name?'Donne un nom à la tontine.':!(amount>0)?'Indique le montant de la cotisation.':members.length<2?'Ajoute au moins 2 membres, un par ligne.':'';
  if(err){$('f-err').textContent=err;return}
  var order=members.map(function(m){return m.id});
  if($('f-shuffle').checked)order=shuffle(order);
  var t={id:uid(),name:name,amount:amount,freq:$('f-freq').value,start:$('f-start').value||todayISO(),members:members,order:order,round:0,paid:{},history:[],cycles:1};
  state.tontines.unshift(t);save();go({name:'detail',id:t.id});
}
function closeRound(t){
  var r=t.round;
  t.history.push({r:r,mid:t.order[r],got:paidN(t)*t.amount,date:todayISO()});
  t.round++;save();
  sheet=null;render();window.scrollTo(0,0);
  var n=benef(t);toast(n?'Tour clôturé. Prochain : '+n.name:'Cycle terminé');
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,d=el.dataset,t=d.t?T(d.t):null;
  if(a==='scrim'){if(e.target!==el)return;sheet=null;renderSheet();return}
  switch(a){
    case 'go-home':go({name:'home'});break;
    case 'go-new':go({name:'new'});break;
    case 'open':go({name:'detail',id:d.t});break;
    case 'example':var x=exampleT();state.tontines.unshift(x);save();go({name:'detail',id:x.id});break;
    case 'settings':sheet={type:'settings'};renderSheet();break;
    case 'lock-copy':copy(device());break;
    case 'lock-go':lockGo();break;
    case 'close-sheet':sheet=null;renderSheet();break;
    case 'toggle':
      if(!t)break;var r=t.round;t.paid[r]=t.paid[r]||{};
      if(t.paid[r][d.m])delete t.paid[r][d.m];else t.paid[r][d.m]=true;
      save();render();break;
    case 'close-round':
      if(!t)break;var left=t.members.length-paidN(t);
      if(left>0){sheet={type:'confirm',title:'Clôturer avec des impayés ?',body:left+' membre'+(left>1?'s n\'ont':' n\'a')+' pas encore payé. La cagnotte versée sera de '+fmt(paidN(t)*t.amount)+' FCFA au lieu de '+fmt(pot(t))+' FCFA.',yes:'Clôturer quand même',act:'do-close',t:t.id};renderSheet()}
      else closeRound(t);
      break;
    case 'do-close':if(t)closeRound(t);break;
    case 'new-cycle':if(t){t.round=0;t.paid={};t.history=[];t.cycles++;t.start=todayISO();t.example=false;save();render();toast('Nouveau cycle commencé')}break;
    case 'copy-summary':if(t)copy(summaryText(t));break;
    case 'copy-msg':if(t){var m=M(t,d.m);if(m)copy(reminderText(t,m))}break;
    case 'move':
      if(!t)break;var i=t.order.indexOf(d.m),j=i+Number(d.dir);
      if(i<0||j<=t.round||j>=t.order.length)break;
      var tmp=t.order[i];t.order[i]=t.order[j];t.order[j]=tmp;save();render();break;
    case 'edit-member':if(t){sheet={type:'member',t:t.id,m:d.m};renderSheet()}break;
    case 'add-member':if(t){sheet={type:'member',t:t.id,m:null};renderSheet()}break;
    case 'remove-member':
      if(!t)break;t.members=t.members.filter(function(m){return m.id!==d.m});t.order=t.order.filter(function(id){return id!==d.m});
      Object.keys(t.paid).forEach(function(k){delete t.paid[k][d.m]});
      save();sheet=null;render();break;
    case 'ask-delete':if(t){sheet={type:'confirm',title:'Supprimer « '+t.name+' » ?',body:'Les membres, les cotisations et l\'historique seront effacés. Cette action est définitive.',yes:'Supprimer la tontine',act:'do-delete',t:t.id,danger:true};renderSheet()}break;
    case 'do-delete':state.tontines=state.tontines.filter(function(x){return x.id!==d.t});save();go({name:'home'});toast('Tontine supprimée');break;
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='newform')createTontine();
  else if(e.target.id==='memberform'){
    var t=T(e.target.dataset.t);if(!t)return;
    var name=$('m-name').value.trim(),phone=$('m-phone').value.replace(/[^\d+]/g,'');
    if(!name){$('m-err').textContent='Écris le nom du membre.';return}
    var mid=e.target.dataset.m;
    if(mid){var m=M(t,mid);m.name=name;m.phone=phone}
    else{var nm={id:uid(),name:name,phone:phone};t.members.push(nm);t.order.push(nm.id)}
    save();sheet=null;render();
  }
});
document.addEventListener('input',function(e){if(e.target.id==='f-members')updatePreview()});
document.addEventListener('change',function(e){
  if(e.target.id==='set-dial'){state.settings.dial=e.target.value;save()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet){sheet=null;renderSheet()}});

gate().then(function(ok){if(ok)start();else renderLock(lockMsg)},function(){renderLock('')});
})();
</script>

</body>
