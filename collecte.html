<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carnet Collecte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Plan : carnet mobile pour un collecteur d'épargne journalière. L'écran du jour liste les clients avec un bouton Encaisser. Chaque client a sa carte de cases à cocher, comme sur le carnet papier. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --fg:#13201A; --muted:#566860; --line:#DAE2DB;
  --accent:#E3A400; --accent-ink:#1E1500; --accent-soft:#FBEFC7; --track:rgba(19,32,26,.13);
  --ok:#1D7A4B; --on-ok:#FFFFFF; --ok-soft:#DDF1E5; --late:#B23F28; --late-soft:#F8E1DB;
  --scrim:rgba(10,18,14,.55); --shadow:0 1px 0 rgba(19,32,26,.04),0 8px 22px -14px rgba(19,32,26,.35);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1612; --surface:#16231D; --fg:#E7EFE9; --muted:#95A89D; --line:#26362D;
    --accent:#F0B52A; --accent-ink:#1B1400; --accent-soft:#2B2511; --track:rgba(231,239,233,.16);
    --ok:#4CC38A; --on-ok:#07140D; --ok-soft:#173326; --late:#F08A70; --late-soft:#3A1F18;
    --scrim:rgba(0,0,0,.65); --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 22px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1612; --surface:#16231D; --fg:#E7EFE9; --muted:#95A89D; --line:#26362D;
  --accent:#F0B52A; --accent-ink:#1B1400; --accent-soft:#2B2511; --track:rgba(231,239,233,.16);
  --ok:#4CC38A; --on-ok:#07140D; --ok-soft:#173326; --late:#F08A70; --late-soft:#3A1F18;
  --scrim:rgba(0,0,0,.65); --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 22px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--f-body);-webkit-text-size-adjust:100%;
  padding-block:12px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:28px;font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:650}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:22px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{font:700 19px var(--f-display);letter-spacing:-.01em;display:inline-flex;align-items:center;gap:10px}
.logo{flex:none;display:block}
.eyebrow{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.stack{display:flex;flex-direction:column;gap:10px}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:700 16px var(--f-body);text-decoration:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.danger{background:transparent;border:1.5px solid var(--late);color:var(--late)}
.btn.block{width:100%}
.icon{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:inherit;text-align:left}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font:600 12px/1.6 var(--f-body);background:var(--accent-soft);color:var(--fg);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.late{background:var(--late-soft);color:var(--late)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.empty{padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.empty ol{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:15px}
.hero{background:var(--accent-soft);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.big{font-size:38px;font-weight:500;line-height:1.1}
.big small{font-size:16px;color:var(--muted)}
.pbar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--ok);border-radius:99px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font:700 16px var(--f-display);flex:none}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rb .name{text-align:left;background:none;border:0;padding:0;font-weight:700;overflow-wrap:anywhere}
.rb small{color:var(--muted);font-size:13px}
.pay{flex:none;min-width:104px;min-height:44px;padding:0 14px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700}
.pay.done{background:var(--ok-soft);color:var(--ok)}
.pay.full{background:var(--surface);border:1.5px solid var(--line);color:var(--fg)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.box{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font:500 14px var(--f-mono);color:var(--muted);padding:0}
.box[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-ok);font-weight:700}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.hrow:last-child{border-bottom:0}
form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:600;font-size:14px}
.field small{color:var(--muted);font-size:13px}
input[type=text],input[type=tel],input[type=number],select,textarea{width:100%;min-height:50px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
textarea{min-height:120px;resize:vertical;line-height:1.5;font:400 13px/1.4 var(--f-mono);word-break:break-all}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.two{grid-template-columns:1fr}}
.err{color:var(--late);font-weight:600;min-height:1.4em}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.dock .btn{display:flex;max-width:560px;margin-inline:auto}
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--surface);color:var(--fg);border-radius:20px 20px 0 0;padding-top:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .btns{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);text-align:center}
.lock{padding:16px;display:flex;flex-direction:column;gap:12px}
.devcode{font:500 34px var(--f-mono);letter-spacing:.06em;text-align:center;padding:10px 0;background:var(--accent-soft);border-radius:12px}
.warn{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.warn a{font-weight:700;color:inherit}
@media (prefers-reduced-motion:no-preference){.pay,.btn,.pbar span{transition:background-color .15s,width .25s}}
</style>

</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var KEY='carnet-collecte-v1', APP='CP1', DEVKEY='cc-device', UNLOCKKEY='cc-unlock';
var PUB='BPD51WuInUo9nGqOfC42wh2sK1n66WczK8p891uL5GuLg3fhDCyKTiKdlc0DuXtyqvQ-J99IlqdLi0UNnJHU92I';
var OWNER_WA='242066019702';
var COUNTRIES=[
  {dial:'242',name:'Congo (Brazzaville)',keep:true},{dial:'243',name:'RD Congo'},{dial:'237',name:'Cameroun'},
  {dial:'225',name:"Côte d'Ivoire",keep:true},{dial:'221',name:'Sénégal'},{dial:'229',name:'Bénin',keep:true},
  {dial:'228',name:'Togo'},{dial:'223',name:'Mali'},{dial:'226',name:'Burkina Faso'},{dial:'',name:'Autre pays (écrire +indicatif)'}
];
var SLIDERS='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>';
var state={clients:[],settings:{dial:'242'}};
var view={name:'home'}, sheet=null, sync='local', touched=false, ref=null, writing=false, timer=null;
var access=null, memDev='', lockMsg='';

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function fmt(n){return new Intl.NumberFormat('fr-FR').format(n||0).replace(/ /g,' ')}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayISO(){return iso(new Date())}
function startOfToday(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function initial(n){return (String(n||'?').trim().charAt(0)||'?').toUpperCase()}
function fmtDay(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function toast(msg){var el=$('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},2200)}
function copy(text){
  var p=null;try{p=navigator.clipboard&&navigator.clipboard.writeText(text)}catch(e){}
  if(p&&p.then){p.then(function(){toast('Copié')},function(){sheet={type:'text',text:text};renderSheet()})}
  else{sheet={type:'text',text:text};renderSheet()}
}

/* ---------- accès par code ---------- */
var ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function makeId(){var a=new Uint8Array(8);crypto.getRandomValues(a);var s='';for(var i=0;i<8;i++){s+=ALPHA.charAt(a[i]%32);if(i===3)s+='-'}return s}
function device(){
  try{var d=localStorage.getItem(DEVKEY);if(d&&/^[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(d))return d;d=makeId();localStorage.setItem(DEVKEY,d);return d}
  catch(e){return memDev||(memDev=makeId())}
}
function ymdNow(){var d=new Date();return ''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())}
function fmtY(s){return s.slice(6,8)+'/'+s.slice(4,6)+'/'+s.slice(0,4)}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function checkCode(text){
  var m=/(\d{8})\.([A-Za-z0-9_-]{86})/.exec(String(text||'').replace(/\s+/g,''));
  if(!m)return Promise.resolve({ok:false,why:'format'});
  var exp=m[1],dev=device();
  return crypto.subtle.importKey('raw',unb64u(PUB),{name:'ECDSA',namedCurve:'P-256'},false,['verify']).then(function(k){
    return crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,unb64u(m[2]),new TextEncoder().encode(APP+'|'+dev+'|'+exp));
  }).then(function(ok){
    if(!ok)return {ok:false,why:'bad'};
    if(exp<ymdNow())return {ok:false,why:'expired',exp:exp};
    return {ok:true,exp:exp,code:m[1]+'.'+m[2]};
  },function(){return {ok:false,why:'error'}});
}
function gate(){
  var saved='';try{saved=localStorage.getItem(UNLOCKKEY)||''}catch(e){}
  if(!saved)return Promise.resolve(false);
  return checkCode(saved).then(function(r){
    if(r.ok){access=r;return true}
    lockMsg=r.why==='expired'?'Ton accès a expiré le '+fmtY(r.exp)+'. Demande un nouveau code.':'';
    return false;
  });
}
function waLink(text){return 'https://wa.me/'+OWNER_WA+'?text='+encodeURIComponent(text)}
function renewLink(){return waLink('Bonjour, je veux renouveler Carnet Collecte. Mon code d\'appareil : '+device())}
function daysLeft(){if(!access)return 99;var e=access.exp,d=new Date(+e.slice(0,4),+e.slice(4,6)-1,+e.slice(6,8));return Math.round((d-startOfToday())/864e5)}
function LOGO(sz){
  var cells='',i,x,y,on=[0,1,4,5,8];
  for(i=0;i<9;i++){x=10+(i%3)*10;y=10+Math.floor(i/3)*10;cells+='<rect x="'+x+'" y="'+y+'" width="8" height="8" rx="2" fill="'+(on.indexOf(i)>-1?'#F2C14E':'none')+'" stroke="#F2C14E" stroke-width="1.4"/>'}
  return '<svg class="logo" width="'+sz+'" height="'+sz+'" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#14683F"/>'+cells+'<path d="M13 15l2 2 3.5-4M23 15l2 2 3.5-4M13 25l2 2 3.5-4" fill="none" stroke="#14683F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function renderLock(msg){
  var dev=device(),ask='Bonjour, je veux activer Carnet Collecte. Mon code d\'appareil : '+dev;
  $('sheet').innerHTML='';
  $('app').innerHTML='<div class="wrap"><header class="stack"><span class="brand">'+LOGO(48)+'Carnet Collecte</span><h1>Active ton carnet</h1><p class="muted">Cette application est réservée aux abonnés. Chaque appareil a son propre code d\'accès.</p></header>'
  +'<section class="card lock"><div class="eyebrow">Code de ton appareil</div><div class="devcode">'+esc(dev)+'</div>'
  +'<a class="btn" target="_blank" rel="noopener" href="'+waLink(ask)+'">Demander mon code sur WhatsApp</a>'
  +'<button class="btn ghost" data-act="lock-copy">Copier le code de mon appareil</button></section>'
  +'<section class="card lock"><div class="field"><label for="l-code">J\'ai reçu mon code de déblocage</label><textarea id="l-code" autocomplete="off" placeholder="Colle ici le message ou le code reçu"></textarea></div>'
  +'<div class="err" id="l-err" role="alert">'+esc(msg||'')+'</div><button class="btn" data-act="lock-go">Activer</button></section></div>';
}
function lockGo(){
  var err=$('l-err');err.textContent='Vérification…';
  checkCode($('l-code').value).then(function(r){
    if(r.ok){try{localStorage.setItem(UNLOCKKEY,r.code)}catch(e){}access=r;start();return}
    err.textContent=r.why==='expired'?'Ce code a expiré le '+fmtY(r.exp)+'. Demande un nouveau code.'
      :r.why==='format'?'Ce n\'est pas un code complet. Copie-le en entier depuis le message reçu.'
      :r.why==='error'?'Impossible de vérifier le code sur ce navigateur. Ouvre le lien dans Chrome ou Safari à jour.'
      :'Ce code ne marche pas sur cet appareil ou pour cette application. Il faut le code reçu après avoir envoyé le code de cet appareil.';
  });
}

/* ---------- données ---------- */
function normalize(s){
  try{s=JSON.parse(JSON.stringify(s||{}))}catch(e){s={}}
  var out={clients:Array.isArray(s.clients)?s.clients:[],settings:Object.assign({dial:'242'},s.settings||{})};
  out.clients.forEach(function(c){c.ticks=c.ticks||{};c.history=c.history||[];c.days=c.days||31;c.commission=c.commission==null?1:c.commission});
  return out;
}
function C(id){return state.clients.find(function(c){return c.id===id})}
function count(c){return Object.keys(c.ticks).length}
function todayN(c){var t=todayISO();return Object.keys(c.ticks).filter(function(k){return c.ticks[k]===t}).length}
function nextBox(c){for(var n=1;n<=c.days;n++){if(!c.ticks[n])return n}return 0}
function payout(c){return Math.max(0,count(c)-c.commission)*c.amount}
function fee(c){return Math.min(count(c),c.commission)*c.amount}

function save(){
  touched=true;
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  if(!ref)return;
  clearTimeout(timer);
  timer=setTimeout(function tick(){
    if(writing){timer=setTimeout(tick,700);return}
    writing=true;
    ref.set({state:JSON.parse(JSON.stringify(state)),updatedAt:Date.now()}).then(function(){setSync('cloud')},function(){setSync('local')}).then(function(){writing=false});
  },700);
}
function syncText(){
  return sync==='cloud'
    ?'Tes clients sont enregistrés sur ton compte et restent privés.'
    :'Tes clients sont gardés sur cet appareil seulement. Si tu vides les données du navigateur, ils disparaissent.';
}
function setSync(v){sync=v;var el=$('syncnote');if(el)el.textContent=syncText()}
function start(){
  try{var raw=localStorage.getItem(KEY);if(raw)state=normalize(JSON.parse(raw))}catch(e){}
  render();
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return;
      return user.id().then(function(id){
        if(!id)return;
        var d=db.doc('data/users/'+id+'/collecte');
        return d.get().then(function(snap){
          ref=d;
          if(snap.exists&&snap.data()&&snap.data().state){
            var remote=normalize(snap.data().state);
            if(touched){var ids={};remote.clients.forEach(function(c){ids[c.id]=1});state.clients.forEach(function(c){if(!ids[c.id])remote.clients.push(c)})}
            state=remote;
            try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
            setSync('cloud');render();if(touched)save();
          }else{setSync('cloud');if(state.clients.length)save()}
        });
      });
    }).catch(function(){});
  }catch(e){}
}

/* ---------- messages ---------- */
function waNumber(p){
  var s=String(p||'').replace(/[^\d+]/g,'');if(!s)return '';
  if(s.charAt(0)==='+')return s.slice(1);
  if(s.slice(0,2)==='00')return s.slice(2);
  var c=COUNTRIES.find(function(c){return c.dial===state.settings.dial});
  if(!c||!c.dial)return s;
  if(s.charAt(0)==='0'&&!c.keep)s=s.slice(1);
  return c.dial+s;
}
function remindText(c){
  return 'Bonjour '+c.name+', ta cotisation du jour ('+fmt(c.amount)+' FCFA) pour ta carte d\'épargne n\'est pas encore passée. Merci !';
}
function daySummary(){
  var t=todayISO(),lines=[],total=0;
  state.clients.forEach(function(c){var n=todayN(c);if(n){lines.push('✅ '+c.name+' : '+fmt(n*c.amount)+' FCFA');total+=n*c.amount}});
  var late=state.clients.filter(function(c){return !todayN(c)&&nextBox(c)}).map(function(c){return c.name});
  var out=['Point du '+fmtDay(t),''].concat(lines.length?lines:['Aucun encaissement pour l\'instant']);
  out.push('','Total encaissé : '+fmt(total)+' FCFA');
  if(late.length)out.push('À passer voir : '+late.join(', '));
  return out.join('\n');
}

/* ---------- vues ---------- */
function topbar(){return '<div class="top"><span class="brand">'+LOGO(32)+'Carnet Collecte</span><button class="icon" data-act="settings" aria-label="Réglages">'+SLIDERS+'</button></div>'}
function emptyV(){
  return '<section class="card empty"><h1>Ton premier client</h1>'
  +'<p class="muted">Le carnet remplace ton cahier de cartes : une carte de cases par client, et le total encaissé chaque jour.</p>'
  +'<ol><li>1. Ajoute un client avec son montant par jour.</li><li>2. Appuie sur Encaisser quand il paie.</li><li>3. Quand la carte est pleine, rembourse et recommence.</li></ol>'
  +'<div class="stack"><button class="btn block" data-act="go-new">Ajouter un client</button><button class="btn ghost block" data-act="example">Voir un exemple</button></div></section>';
}
function rowC(c){
  var n=todayN(c),full=!nextBox(c),btn=full
    ?'<button class="pay full" data-act="open" data-c="'+c.id+'">Carte pleine</button>'
    :n?'<button class="pay done" data-act="open" data-c="'+c.id+'" aria-label="'+esc(c.name)+' a payé aujourd\'hui">Payé ✓</button>'
    :'<button class="pay" data-act="collect" data-c="'+c.id+'" aria-label="Encaisser '+fmt(c.amount)+' FCFA pour '+esc(c.name)+'">Encaisser</button>';
  return '<li class="row"><div class="av" aria-hidden="true">'+esc(initial(c.name))+'</div><div class="rb"><button class="name" data-act="open" data-c="'+c.id+'">'+esc(c.name)+'</button><small class="mono">'+fmt(c.amount)+' FCFA/jour · '+count(c)+'/'+c.days+' cases</small></div>'+btn+'</li>';
}
function homeV(){
  var h='<div class="wrap">'+topbar();
  if(access&&daysLeft()<=7)h+='<p class="warn">Ton accès se termine le '+fmtY(access.exp)+'. <a target="_blank" rel="noopener" href="'+renewLink()+'">Renouveler sur WhatsApp</a></p>';
  if(!state.clients.length){h+=emptyV()}
  else{
    var total=0,held=0,toSee=0;
    state.clients.forEach(function(c){total+=todayN(c)*c.amount;held+=payout(c);if(!todayN(c)&&nextBox(c))toSee++});
    h+='<section class="hero"><div class="eyebrow">Encaissé aujourd\'hui</div><div class="big mono">'+fmt(total)+' <small>FCFA</small></div>'
      +'<p class="muted">'+(toSee?toSee+' client'+(toSee>1?'s':'')+' à passer voir':'Tous les clients sont passés')+' · '+fmt(held)+' FCFA à rendre aux clients</p>'
      +'<button class="btn ghost" data-act="copy-day">Copier le point du jour</button></section>';
    h+='<section class="stack"><div class="sec-head"><h2>Mes clients</h2><span class="muted">'+state.clients.length+'</span></div><ul class="rows">'+state.clients.map(rowC).join('')+'</ul></section>';
  }
  h+='<p class="note" id="syncnote">'+esc(syncText())+'</p></div>';
  if(state.clients.length)h+='<div class="dock"><button class="btn block" data-act="go-new">+ Nouveau client</button></div>';
  return h;
}
function newV(){
  return '<div class="wrap"><div class="top"><button class="linkbtn" data-act="go-home">← Mes clients</button></div>'
  +'<header class="stack"><h1>Nouveau client</h1><p class="muted">Une carte de cases est créée pour lui.</p></header>'
  +'<form id="newform" novalidate>'
  +'<div class="field"><label for="f-name">Nom du client</label><input id="f-name" type="text" autocomplete="off" placeholder="Maman Prisca"></div>'
  +'<div class="field"><label for="f-phone">Téléphone (facultatif)</label><input id="f-phone" type="tel" autocomplete="off" placeholder="06 123 4567"><small>Sert à le prévenir sur WhatsApp.</small></div>'
  +'<div class="two"><div class="field"><label for="f-amount">Montant par jour (FCFA)</label><input id="f-amount" type="text" inputmode="numeric" autocomplete="off" placeholder="500"></div>'
  +'<div class="field"><label for="f-days">Cases sur la carte</label><input id="f-days" type="number" inputmode="numeric" min="5" max="62" value="31"></div></div>'
  +'<div class="field"><label for="f-com">Commission du collecteur (en jours)</label><input id="f-com" type="number" inputmode="numeric" min="0" max="5" value="1"><small>Souvent 1 jour de cotisation par carte pleine.</small></div>'
  +'<div id="f-err" class="err" role="alert"></div><button class="btn block" type="button" data-act="submit-form" data-form="newform">Créer la carte</button></form></div>';
}
function detailV(){
  var c=C(view.id);if(!c){view={name:'home'};return homeV()}
  var cnt=count(c),pct=Math.round(cnt/c.days*100),nb=nextBox(c);
  var h='<div class="wrap"><div class="top"><button class="linkbtn" data-act="go-home">← Mes clients</button><button class="icon" data-act="settings" aria-label="Réglages">'+SLIDERS+'</button></div>';
  h+='<header class="stack"><h1>'+esc(c.name)+(c.example?' <span class="pill">Exemple</span>':'')+'</h1><p class="muted mono">'+fmt(c.amount)+' FCFA par jour · carte de '+c.days+' cases</p></header>';
  h+='<section class="hero"><div class="eyebrow">À rendre au client</div><div class="big mono">'+fmt(payout(c))+' <small>FCFA</small></div>'
    +'<div class="pbar" aria-hidden="true"><span style="width:'+pct+'%"></span></div>'
    +'<p class="mono muted">'+cnt+' / '+c.days+' cases · épargné '+fmt(cnt*c.amount)+' · commission '+fmt(fee(c))+'</p></section>';
  h+='<section class="stack"><div class="sec-head"><h2>Carte de pointage</h2><span class="muted">Touche une case pour la cocher</span></div><div class="grid">';
  for(var n=1;n<=c.days;n++){var on=!!c.ticks[n];h+='<button class="box" data-act="box" data-c="'+c.id+'" data-n="'+n+'" aria-pressed="'+on+'" aria-label="Case '+n+(on?', payée le '+fmtDay(c.ticks[n]):', à payer')+'">'+(on?'✓':n)+'</button>'}
  h+='</div></section>';
  h+='<section class="stack">';
  if(nb)h+='<button class="btn block" data-act="collect" data-c="'+c.id+'">Encaisser '+fmt(c.amount)+' FCFA (case '+nb+')</button>';
  else h+='<p class="pill ok">Carte pleine : tu peux rembourser le client</p>';
  if(!todayN(c)&&nb&&c.phone)h+='<a class="btn ghost block" target="_blank" rel="noopener" href="https://wa.me/'+waNumber(c.phone)+'?text='+encodeURIComponent(remindText(c))+'">Prévenir sur WhatsApp</a>';
  h+='<button class="btn ghost block" data-act="ask-payout" data-c="'+c.id+'">Rembourser et recommencer une carte</button></section>';
  if(c.history.length)h+='<section class="stack"><h2>Anciennes cartes</h2><div>'+c.history.slice().reverse().map(function(x){return '<div class="hrow"><span>'+fmtDay(x.date)+' · '+x.count+' cases</span><span class="mono">'+fmt(x.payout)+' FCFA rendus</span></div>'}).join('')+'</div></section>';
  h+='<section class="stack"><button class="btn ghost block" data-act="edit" data-c="'+c.id+'">Modifier le nom ou le montant</button><button class="btn danger block" data-act="ask-delete" data-c="'+c.id+'">Supprimer ce client</button><p class="note" id="syncnote">'+esc(syncText())+'</p></section></div>';
  return h;
}
function renderSheet(){
  var el=$('sheet');
  if(!sheet){el.innerHTML='';return}
  var h='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">';
  if(sheet.type==='confirm'){
    h+='<h2>'+esc(sheet.title)+'</h2><p class="muted">'+esc(sheet.body)+'</p><div class="btns"><button class="btn'+(sheet.danger?' danger':'')+' block" data-act="'+sheet.act+'" data-c="'+(sheet.c||'')+'">'+esc(sheet.yes)+'</button><button class="btn ghost block" data-act="close-sheet">Annuler</button></div>';
  }else if(sheet.type==='text'){
    h+='<h2>Copie ce texte</h2><textarea id="s-text" readonly>'+esc(sheet.text)+'</textarea><div class="btns"><button class="btn block" data-act="close-sheet">Fermer</button></div>';
  }else if(sheet.type==='settings'){
    h+='<h2>Réglages</h2><div class="field"><label for="set-dial">Pays des numéros de téléphone</label><select id="set-dial">'
      +COUNTRIES.map(function(c){return '<option value="'+c.dial+'"'+(c.dial===state.settings.dial?' selected':'')+'>'+esc(c.name+(c.dial?' (+'+c.dial+')':''))+'</option>'}).join('')
      +'</select><small>Un numéro écrit avec + et l\'indicatif marche toujours.</small></div><p class="note">'+esc(syncText())+'</p><p class="note">'+(access?'Accès valable jusqu\'au '+fmtY(access.exp)+'. ':'')+'Code de cet appareil : '+esc(device())+'</p><div class="btns"><button class="btn block" data-act="close-sheet">Terminé</button></div>';
  }else if(sheet.type==='edit'){
    var c=C(sheet.c);
    h+='<h2>Modifier le client</h2><form id="editform" data-c="'+c.id+'" novalidate><div class="field"><label for="e-name">Nom</label><input id="e-name" type="text" autocomplete="off" value="'+esc(c.name)+'"></div>'
      +'<div class="field"><label for="e-phone">Téléphone</label><input id="e-phone" type="tel" autocomplete="off" value="'+esc(c.phone)+'"></div>'
      +'<div class="field"><label for="e-amount">Montant par jour (FCFA)</label><input id="e-amount" type="text" inputmode="numeric" value="'+c.amount+'"><small>Change le montant de toute la carte, y compris les cases déjà cochées.</small></div>'
      +'<div id="e-err" class="err" role="alert"></div><div class="btns"><button class="btn block" type="button" data-act="submit-form" data-form="editform">Enregistrer</button><button class="btn ghost block" type="button" data-act="close-sheet">Annuler</button></div></form>';
  }
  h+='</div></div>';
  el.innerHTML=h;
  var f=$('e-name')||$('s-text');
  if(f)setTimeout(function(){f.focus();if(f.id==='s-text')f.select()},30);
}
function render(){
  $('app').innerHTML=view.name==='new'?newV():view.name==='detail'?detailV():homeV();
  renderSheet();
}
function go(v){view=v;sheet=null;render();window.scrollTo(0,0)}

/* ---------- actions ---------- */
function exampleC(){
  function mk(name,amount,k,todayToo){
    var t={},d=new Date();
    for(var n=1;n<=k;n++){var x=new Date(d);x.setDate(d.getDate()-(k-n)-(todayToo?0:1));t[n]=iso(x)}
    return {id:uid(),name:name,phone:'',amount:amount,days:31,commission:1,ticks:t,history:[],example:true};
  }
  return [mk('Maman Prisca',500,12,false),mk('Josiane',1000,8,true),mk('Hervé',500,20,false)];
}
function collect(c){
  var n=nextBox(c);if(!n){toast('Carte pleine');return}
  c.ticks[n]=todayISO();save();render();toast(c.name+' : '+fmt(c.amount)+' FCFA encaissés');
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,d=el.dataset,c=d.c?C(d.c):null;
  if(a==='scrim'){if(e.target!==el)return;sheet=null;renderSheet();return}
  switch(a){
    case 'submit-form':var fm=$(d.form);if(fm)fm.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));break;
    case 'go-home':go({name:'home'});break;
    case 'go-new':go({name:'new'});break;
    case 'open':go({name:'detail',id:d.c});break;
    case 'example':var ex=exampleC();ex.reverse().forEach(function(x){state.clients.unshift(x)});save();go({name:'home'});break;
    case 'settings':sheet={type:'settings'};renderSheet();break;
    case 'close-sheet':sheet=null;renderSheet();break;
    case 'lock-copy':copy(device());break;
    case 'lock-go':lockGo();break;
    case 'copy-day':copy(daySummary());break;
    case 'collect':if(c)collect(c);break;
    case 'box':
      if(!c)break;var n=d.n;
      if(c.ticks[n]){delete c.ticks[n];toast('Case '+n+' retirée')}else{c.ticks[n]=todayISO()}
      save();var y=window.scrollY;render();window.scrollTo(0,y);break;
    case 'edit':if(c){sheet={type:'edit',c:c.id};renderSheet()}break;
    case 'ask-payout':
      if(!c)break;sheet={type:'confirm',title:'Rembourser '+c.name+' ?',body:'Tu rends '+fmt(payout(c))+' FCFA ('+count(c)+' cases moins '+c.commission+' jour'+(c.commission>1?'s':'')+' de commission). La carte est archivée et une nouvelle carte commence.',yes:'Rembourser et recommencer',act:'do-payout',c:c.id};renderSheet();break;
    case 'do-payout':
      if(!c)break;c.history.push({date:todayISO(),count:count(c),payout:payout(c)});c.ticks={};c.example=false;save();sheet=null;render();toast('Carte archivée, nouvelle carte');break;
    case 'ask-delete':if(c){sheet={type:'confirm',title:'Supprimer '+c.name+' ?',body:'La carte et l\'historique seront effacés. Cette action est définitive.',yes:'Supprimer le client',act:'do-delete',c:c.id,danger:true};renderSheet()}break;
    case 'do-delete':state.clients=state.clients.filter(function(x){return x.id!==d.c});save();go({name:'home'});toast('Client supprimé');break;
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='newform'){
    var name=$('f-name').value.trim(),amount=parseInt(($('f-amount').value||'').replace(/\D/g,''),10),days=parseInt($('f-days').value,10),com=parseInt($('f-com').value,10);
    var err=!name?'Écris le nom du client.':!(amount>0)?'Indique le montant par jour.':!(days>=5&&days<=62)?'Le nombre de cases doit être entre 5 et 62.':!(com>=0&&com<days)?'La commission doit être entre 0 et le nombre de cases.':'';
    if(err){$('f-err').textContent=err;$('f-err').scrollIntoView({block:'center'});return}
    var nc={id:uid(),name:name,phone:$('f-phone').value.replace(/[^\d+]/g,''),amount:amount,days:days,commission:com,ticks:{},history:[]};
    state.clients.push(nc);save();go({name:'detail',id:nc.id});
  }else if(e.target.id==='editform'){
    var c=C(e.target.dataset.c);if(!c)return;
    var nm=$('e-name').value.trim(),am=parseInt(($('e-amount').value||'').replace(/\D/g,''),10);
    if(!nm){$('e-err').textContent='Écris le nom du client.';return}
    if(!(am>0)){$('e-err').textContent='Indique le montant par jour.';return}
    c.name=nm;c.phone=$('e-phone').value.replace(/[^\d+]/g,'');c.amount=am;c.example=false;save();sheet=null;render();
  }
});
document.addEventListener('change',function(e){if(e.target.id==='set-dial'){state.settings.dial=e.target.value;save()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet){sheet=null;renderSheet()}});

gate().then(function(ok){if(ok)start();else renderLock(lockMsg)},function(){renderLock('')});
})();
</script>
